# 趣味常识与百科脑筋急转弯题库
# 丰富日常游戏聊天气氛

name: "趣味百科"
enabled: true
weight: 30
worlds: []
questions:
  # 题目唯一标识
  - id: gen_ocean
    # 题目文本内容
    text: "地球上面积最大的大洋是？"
    # 题目类型（single 单选 / multiple 多选 / input 问答）
    type: single
    # 候选选项列表
    options:
      A: "大西洋"
      B: "太平洋"
      C: "印度洋"
      D: "北冰洋"
    # 正确答案选项或文本列表
    answer:
      - B
    # 题目难度（对应 config.yml 中的 difficulties 节点）
    difficulty: easy
    # 客制化提示文本
    messages:
      question: "🌍 &b{bank_name}&f · {difficulty} &b{player_name}&f，请回答：&9{quiz_id}&f → {question}"
      on-correct: "✅ &a地理百科达人！&b{player_name}&f 答对了！正确答案：&9{correct_option}&f 🎉"
      on-wrong: "❌ &c抱歉 &b{player_name}&f，答案 &9{option}&f 错误！"
    # 答对奖励指令列表（支持 console, player, sound）
    rewards:
      - "console:money give {player_name} 600"

  - id: gen_elements
    text: "常温下一个标准水分子由哪些化学元素构成？(多选)"
    type: multiple
    options:
      A: "氢元素"
      B: "氧元素"
      C: "碳元素"
      D: "氮元素"
    answer:
      - A
      - B
    difficulty: normal
    messages:
      question: "🌍 &b{bank_name}&f · {difficulty} &b{player_name}&f，请作答：&9{quiz_id}&f → {question}"
      on-correct: "✅ &b化学满分！&b{player_name}&f 全部选对！正确答案：&9{correct_option}&f 🎉"
      on-wrong: "❌ &c抱歉 &b{player_name}&f，你的选项不完全正确！"
    rewards:
      - "console:money give {player_name} 900"

  - id: gen_mojang_feature
    text: "在Minecraft玩家社区中，当游戏出现未预期的错误或漏洞时，玩家常调侃这叫什么？"
    type: single
    options:
      A: "特性"
      B: "彩蛋"
      C: "魔法"
      D: "彩虹"
    answer:
      - A
    difficulty: easy
    messages:
      question: "🌍 &b{bank_name}&f · {difficulty} &b{player_name}&f，请回答：&9{quiz_id}&f → {question}"
      on-correct: "✅ &a老MC懂哥！&b{player_name}&f 这叫特性！答案：&9{correct_option}&f 🎉"
      on-wrong: "❌ &c看来你还不够老手 &b{player_name}&f，答案不对！"
    rewards:
      - "console:money give {player_name} 600"
