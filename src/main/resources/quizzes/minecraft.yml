# 原版生存机制与基础常识题库
# 唯一标识对应当前文件名 minecraft

name: "原版生存"
enabled: true
weight: 50
worlds: []
questions:
  # 题目唯一标识
  - id: mc_torch
    # 题目文本内容
    text: "合成火把的合成配方是？"
    # 题目类型（single 单选 / multiple 多选 / input 问答）
    type: single
    # 候选选项列表
    options:
      A: "煤炭加木棍"
      B: "铁锭加木棍"
      C: "打火石加木板"
      D: "红石加木棍"
    # 正确答案选项或文本列表
    answer:
      - A
    # 题目难度（对应 config.yml 中的 difficulties 节点）
    difficulty: easy
    # 客制化提示文本
    messages:
      question: "📝 &b{bank_name}&f · {difficulty} &b{player_name}&f，请回答：&9{quiz_id}&f → {question}"
      on-correct: "✅ &a恭喜 &b{player_name}&f，答对了！正确答案：&9{correct_option}&f 🎉"
      on-wrong: "❌ &c抱歉 &b{player_name}&f，答案 &9{option}&f 错误，再接再厉！"
    # 答对奖励指令列表（支持 console, player, sound）
    rewards:
      - "console:money give {player_name} 500"
      - "console:exp give {player_name} 10"

  - id: mc_smoker
    text: "烟熏炉的烧炼食物速度是普通熔炉的几倍？"
    type: single
    options:
      A: "1.5倍"
      B: "2倍"
      C: "3倍"
      D: "4倍"
    answer:
      - B
    difficulty: easy
    messages:
      question: "📝 &b{bank_name}&f · {difficulty} &b{player_name}&f，请回答：&9{quiz_id}&f → {question}"
      on-correct: "✅ &a恭喜 &b{player_name}&f，答对了！正确答案：&9{correct_option}&f 🎉"
      on-wrong: "❌ &c抱歉 &b{player_name}&f，答案 &9{option}&f 错误！"
    rewards:
      - "console:money give {player_name} 500"
      - "console:exp give {player_name} 10"

  - id: mc_piston_push_limit
    text: "普通活塞一次最多可以推动多少个方块？"
    type: single
    options:
      A: "10个"
      B: "12个"
      C: "15个"
      D: "16个"
    answer:
      - B
    difficulty: normal
    messages:
      question: "📝 &b{bank_name}&f · {difficulty} &b{player_name}&f，请回答：&9{quiz_id}&f → {question}"
      on-correct: "✅ &a机制大师！&b{player_name}&f 答对了！正确答案：&9{correct_option}&f 🎉"
      on-wrong: "❌ &c抱歉 &b{player_name}&f，答案 &9{option}&f 错误！"
    rewards:
      - "console:money give {player_name} 800"
      - "console:exp give {player_name} 15"

  - id: mc_fortune_silk_touch
    text: "以下关于工具附魔特性的说法中正确的有？(多选)"
    type: multiple
    options:
      A: "时运与精准采集附魔不能共存"
      B: "精准采集可以完整采集带蜜蜂的蜂巢"
      C: "时运附魔可以提升远古残骸的掉落数量"
      D: "时运附魔对掉落自身为物品的矿石生效"
    answer:
      - A
      - B
      - D
    difficulty: normal
    messages:
      question: "📝 &b{bank_name}&f · {difficulty} &b{player_name}&f，请作答：&9{quiz_id}&f → {question}"
      on-correct: "✅ &b专业矿工！&b{player_name}&f 全部选对！正确答案：&9{correct_option}&f 🎉"
      on-wrong: "❌ &c可惜 &b{player_name}&f，你的选项 &9{option}&f 不完全正确！"
    rewards:
      - "console:money give {player_name} 1000"
      - "console:exp give {player_name} 20"

  - id: mc_observer_pulse
    text: "红石侦测器检测到前方方块改变时会发出几刻时长的红石脉冲？"
    type: single
    options:
      A: "1刻"
      B: "2刻"
      C: "3刻"
      D: "4刻"
    answer:
      - A
    difficulty: hard
    messages:
      question: "📝 &b{bank_name}&f · {difficulty} &b{player_name}&f，请抢答：&9{quiz_id}&f → {question}"
      on-correct: "✅ &c红石大佬！&b{player_name}&f 抢答正确！正确答案：&9{correct_option}&f 🎉"
      on-wrong: "❌ &c答错啦 &b{player_name}&f，答案 &9{option}&f 不正确！"
    rewards:
      - "console:money give {player_name} 1500"
      - "console:exp give {player_name} 30"

  - id: mc_enchant_table
    text: "原版中用于给装备与书本赋予魔咒的专用功能方块叫什么？"
    type: input
    answer:
      - "附魔台"
      - "enchanting table"
    difficulty: hard
    messages:
      question: "📝 &b{bank_name}&f · {difficulty} &b{player_name}&f，请直接输入文本抢答：&9{quiz_id}&f → {question}"
      on-correct: "✅ &c手速惊人！&b{player_name}&f 抢答正确！答案就是 &9{correct_option}&f 🎉"
      on-wrong: "❌ &c手慢或回答错误 &b{player_name}&f，你的输入 &9{option}&f 不对！"
    rewards:
      - "console:money give {player_name} 1500"
      - "console:exp give {player_name} 30"
